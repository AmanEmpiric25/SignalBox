name: signalbox
description: "SignalBox - a local-first smart notification manager for Android, built with Flutter."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Persistence: SQLite, hand-written SQL (no code generation step).
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # Key/value settings
  shared_preferences: ^2.3.3

  # Date and number formatting
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Lets the SQLite layer run in unit tests on desktop and in CI.
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
